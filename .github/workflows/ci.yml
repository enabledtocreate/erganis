# CI for parent erganis repo: submodules + per-repo tests + integration/e2e
name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erganis
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: erganis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erganis -d erganis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://erganis:dev_password@localhost:5432/erganis
      JWT_SECRET: ci-test-jwt-secret
      AUTH_OIDC_MOCK: "true"
      AUTH_LOCAL_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test Core contracts
        run: |
          cd core/contracts
          npm ci
          npm test

      - name: Build and test Core platform package
        run: |
          cd core/packages/typescript
          npm ci
          npm run build
          npm test

      - name: Build and test Core DAL (PostgreSQL)
        run: |
          cd core/packages/typescript && npm ci && npm run build
          cd ../../data/dal
          npm ci
          npm run build
          npm test

      - name: Build and test Core services
        run: |
          cd core/packages/typescript && npm ci && npm run build
          cd ../../data/dal && npm ci && npm run build
          cd ../../services
          npm ci
          npm run build
          npm test
          npm run test:e2e

  other-submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test studio
        run: |
          if [ -f studio/package.json ]; then
            cd studio && npm ci && npm test && cd ..
          fi

      - name: Test agora
        run: |
          if [ -f agora/api/package.json ]; then
            cd agora/api && npm ci && npm test && cd ../..
          fi

      - name: Test companion
        run: |
          if [ -f companion/package.json ]; then
            cd companion && npm ci && npm test && cd ..
          fi

      - name: Integration tests
        run: |
          chmod +x scripts/test-integration.sh 2>/dev/null || true
          ./scripts/test-integration.sh || true

      - name: E2E tests
        run: |
          chmod +x scripts/test-e2e.sh 2>/dev/null || true
          ./scripts/test-e2e.sh || true
