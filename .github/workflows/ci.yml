# CI for parent erganis repo: submodules + per-repo tests + integration/e2e
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Test Core (contracts, services, packages)
        run: |
          if [ -f core/contracts/package.json ]; then
            cd core/contracts && npm ci && npm test && cd ../..
          fi
          if [ -f core/services/package.json ]; then
            cd core/services && npm ci && npm test && cd ../..
          fi
          if [ -f core/packages/package.json ]; then
            cd core/packages && npm ci && npm test && cd ../..
          fi

      - name: Test studio
        run: |
          if [ -f studio/package.json ]; then
            cd studio && npm ci && npm test && cd ..
          fi

      - name: Test agora
        run: |
          if [ -f agora/api/package.json ]; then
            cd agora/api && npm ci && npm test && cd ../..
          fi

      - name: Test companion
        run: |
          if [ -f companion/package.json ]; then
            cd companion && npm ci && npm test && cd ..
          fi

      - name: Integration tests
        run: |
          chmod +x scripts/test-integration.sh 2>/dev/null || true
          ./scripts/test-integration.sh || true

      - name: E2E tests
        run: |
          chmod +x scripts/test-e2e.sh 2>/dev/null || true
          ./scripts/test-e2e.sh || true
